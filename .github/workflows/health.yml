name: Mod health check

on:
  schedule:
    - cron: "0 6 * * *"   # daily — picks up new Zen releases and mod updates
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Download latest Zen release
        run: |
          curl -fsSL -o zen.tar.xz https://github.com/zen-browser/desktop/releases/latest/download/zen.linux-x86_64.tar.xz
          tar -xJf zen.tar.xz
          grep '^Version=' zen/application.ini

      - name: Check all mods
        run: npm run check -- --zen zen --out site

      - name: Job summary
        run: cat site/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
